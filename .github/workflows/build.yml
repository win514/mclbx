name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: 构建 ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: 构建
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w -X 'main.version=mclbx dev'" -o dist/mclbx-${{ matrix.goos }}-${{ matrix.goarch }} .

  check:
    name: 格式与静态检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: gofmt
        shell: pwsh
        run: |
          $diff = gofmt -l .
          if ($diff) { $diff; exit 1 }
          Write-Host "格式一致"
      # unsafeptr 检查关闭：调用 Win32 的惯用写法是 syscall.NewLazyDLL 加
      # unsafe.Pointer 取参，该检查对这类写法一律报误判，实际并无可修的问题。
      - name: go vet
        env:
          CGO_ENABLED: "0"
        run: go vet -unsafeptr=false ./...

  test:
    name: 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # 跳过与像素基准和进程历史相关的用例：它们比较的是本机字体与绘图结果，
      # 在不同运行环境之间不可比，需要在本地用 go test -update 重录后才有意义。
      - name: go test
        env:
          CGO_ENABLED: "0"
        run: go test -skip "(Visual|DumpAllTaskPages|RenderingDoesNotDependOnProcessHistory)" ./...
